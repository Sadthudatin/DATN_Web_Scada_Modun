[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["plc/+/telemetry"]
  qos = 1
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PW}"
  data_format = "json_v2"
  name_override = "plc"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "plc"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      tags = ["device", "quality"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "datn"
  bucket = "plc"
  timeout = "10s"
